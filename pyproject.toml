[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-pipeline"
version = "0.0.1"
description = "Config-driven pipeline from a validated URDF to a tested MuJoCo digital twin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
sim = ["mujoco>=3.2", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
twin = "twin_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
