# Mesh-based example twin: a 4-joint arm whose geometry is generated by make_meshes.py (no CAD, no lab data).
# It exercises what the primitive arm_demo does not: package:// and relative mesh paths, an STL over
# meshes.max_faces (split), an ASCII STL (converted), an OBJ, Y-up gravity, every collision mode but
# convex_decomposition, every actuator type, joint overrides including zero_offset, and a fixed tool frame.
# Every value below is an example for this made-up arm, not a measurement of a real robot.
schema_version: 1
robot: mesh_arm
description: Generated-mesh example arm for tests and CI; Y-up like many CAD exports.
urdf: mesh_arm_description/urdf/mesh_arm.urdf
up_axis: "+y"

# --- mjcf stage ---
meshes:
  max_faces: 500          # low on purpose so the 672-face base.stl is split; MuJoCo's own limit is 200000
collision:
  default: convex_hull
  links:
    base_link: none       # a base shell's hull would swallow the arm, so the base does not collide
    hand_link: mesh       # the URDF's collision primitive as it is
actuators:
  default: {type: position, kp: 20.0, kv: 1.0}
  joints:
    elbow_joint: {type: position, kp: 40.0, kv: 2.0}
    wrist_joint: {type: velocity, kv: 0.5}
    gripper_joint: {type: motor}

# --- robot facts that are not in the CAD; every value says where it comes from ---
joints:
  shoulder_joint:
    zero_offset: 0.1
    source: calibrated
    note: Example only; the encoder zero sits 0.1 rad from the CAD zero.
  elbow_joint:
    damping: 0.05
    friction: 0.01
    source: assumed
  wrist_joint:
    velocity: 3.0
    source: assumed
  gripper_joint:
    effort: 2.0
    source: measured
home:
  shoulder_joint: 0.2
  elbow_joint: 0.5
assumptions:
  - id: generated_geometry
    text: The meshes are generated shapes; inertias are those of simple solids of about the same size.
    source: assumed

# --- smoke and report stages ---
smoke:
  sweep_fraction: 0.8
  settle_seconds: 1.0
report:
  title: Mesh arm
